<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Reports</h1>
        <p class="page-subtitle">Results of completed scans. Open a report to see what changed since the previous run.</p>
    </div>
</div>

<div class="card p-3 mb-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
        <div class="lg:col-span-2">
            <label class="label text-xs" for="searchInput">Search</label>
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="search" id="searchInput" class="input pl-9" placeholder="Task name, IP address or hostname…">
            </div>
        </div>
        <div>
            <label class="label text-xs" for="taskFilter">Task</label>
            <select id="taskFilter" class="select"><option value="">All tasks</option></select>
        </div>
        <div>
            <label class="label text-xs" for="fromDate">From</label>
            <input type="date" id="fromDate" class="input">
        </div>
        <div>
            <label class="label text-xs" for="toDate">To</label>
            <input type="date" id="toDate" class="input">
        </div>
    </div>
    <div class="flex items-center justify-between mt-3">
        <button type="button" id="clearFilters" class="btn-ghost btn-sm invisible"><i class="fas fa-times"></i>Clear filters</button>
        <div id="perPageHost" class="flex items-center"></div>
    </div>
</div>

<div id="reportsContainer" class="space-y-3"></div>
<div id="paginationControls" class="hidden flex items-center justify-between mt-4"></div>

<script>
const container = document.getElementById('reportsContainer');
const els = { q: document.getElementById('searchInput'), task: document.getElementById('taskFilter'), from: document.getElementById('fromDate'), to: document.getElementById('toDate') };
els.q.value = getParam('q'); els.from.value = getParam('from'); els.to.value = getParam('to');
const clearBtn = document.getElementById('clearFilters');
const pager = new Paginator({ perPageHost: 'perPageHost', controlsHost: 'paginationControls', onChange: loadReports });

function filterValues() { return { q: els.q.value.trim(), task_id: els.task.value || getParam('task_id'), from: els.from.value, to: els.to.value }; }
function syncClear() { const f = filterValues(); clearBtn.classList.toggle('invisible', !f.q && !f.task_id && !f.from && !f.to); }
function filtersChanged() { pager.reset(); setParams(filterValues()); syncClear(); loadReports(); }
let t; els.q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(filtersChanged, 300); });
[els.task, els.from, els.to].forEach(el => el.addEventListener('change', filtersChanged));
clearBtn.addEventListener('click', () => { els.q.value = ''; els.task.value = ''; els.from.value = ''; els.to.value = ''; filtersChanged(); });

async function loadTaskOptions() {
    const r = await api('/api/scans/tasks/options');
    if (!r.ok) return;
    r.data.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; els.task.appendChild(o); });
    els.task.value = getParam('task_id'); syncClear();
}

async function loadReports() {
    container.innerHTML = `<div class="empty"><i class="fas fa-circle-notch fa-spin"></i>Loading reports…</div>`;
    const f = filterValues();
    const qs = Object.entries(f).map(([k, v]) => `${k}=${encodeURIComponent(v || '')}`).join('&');
    const r = await api(`/api/reports?${pager.query()}&${qs}`);
    if (!r.ok) { container.innerHTML = `<div class="empty text-red-400"><i class="fas fa-triangle-exclamation"></i>${escapeHtml(errorDetail(r, 'Failed to load reports'))}</div>`; return; }
    const data = r.data, reports = data.items || [];
    pager.update(data);
    if (!reports.length) {
        const filtered = f.q || f.task_id || f.from || f.to;
        container.innerHTML = `<div class="card empty"><i class="fas ${filtered ? 'fa-search' : 'fa-file-lines'}"></i><p class="text-gray-300 font-medium">${filtered ? 'No reports match these filters' : 'No reports yet'}</p><p class="text-sm mt-1">${filtered ? 'Try widening the date range or clearing the search.' : 'Run a scan task and its report will appear here.'}</p>${filtered ? '' : '<a href="/tasks" class="btn-primary mt-4"><i class="fas fa-crosshairs"></i>Go to tasks</a>'}</div>`;
        return;
    }
    container.innerHTML = reports.map(r => `
        <div class="card p-4 flex flex-col sm:flex-row sm:items-center gap-4">
            <a href="/reports/${r.id}" class="flex items-center gap-4 flex-1 min-w-0 group">
                <div class="w-11 h-11 rounded-lg bg-primary-500/10 border border-primary-500/20 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-file-shield text-primary-400"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="font-semibold text-white group-hover:text-primary-400">${escapeHtml(r.task_name || 'Unknown task')}</span>
                        <span class="text-xs text-gray-500 font-mono">report #${r.id}</span>
                    </div>
                    <div class="text-sm text-gray-400 mt-0.5 flex flex-wrap gap-x-3">
                        <span><i class="fas fa-server mr-1 text-gray-500"></i>${r.hosts_up}/${r.host_count} hosts up</span>
                        <span><i class="fas fa-plug mr-1 text-gray-500"></i>${pluralize(r.open_ports, 'open port')}</span>
                        <span>${timeCell(r.created_at)}</span>
                    </div>
                </div>
            </a>
            <div class="flex flex-wrap items-center gap-2 sm:flex-shrink-0">
                <a href="/reports/${r.id}" class="btn-primary btn-sm"><i class="fas fa-eye"></i>View</a>
                <a href="/api/reports/${r.id}/download/xml" class="btn-secondary btn-sm" title="Download nmap XML">XML</a>
                <a href="/api/reports/${r.id}/download/txt" class="btn-secondary btn-sm" title="Download plain text">TXT</a>
                <a href="/api/reports/${r.id}/download/pdf" class="btn-secondary btn-sm" title="Download PDF"><i class="fas fa-file-pdf text-red-400"></i>PDF</a>
            </div>
        </div>`).join('');
}

loadTaskOptions();
loadReports();
</script>
{{template "footer" .}}
