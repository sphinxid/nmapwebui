<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Scan Runs</h1>
        <p class="page-subtitle">Every execution across all tasks, newest first.</p>
    </div>
</div>

<div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
    <select id="taskFilter" class="select w-auto min-w-[12rem]" aria-label="Filter by task"><option value="">All tasks</option></select>
    <select id="statusFilter" class="select w-auto" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="running">Running</option>
        <option value="queued">Queued</option>
        <option value="completed">Completed</option>
        <option value="failed">Failed</option>
        <option value="cancelled">Cancelled</option>
    </select>
    <button type="button" id="clearFilters" class="btn-ghost btn-sm hidden"><i class="fas fa-times"></i>Clear</button>
    <div id="perPageHost" class="sm:ml-auto flex items-center"></div>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead><tr><th data-sort="id" data-sort-default="desc">Run</th><th data-sort="task">Task</th><th data-sort="status">Status</th><th class="w-56">Progress</th><th data-sort="started" data-sort-default="desc">Started</th><th data-sort="duration" data-sort-default="desc">Duration</th><th>Report</th><th class="text-right">Actions</th></tr></thead>
            <tbody id="runsBody"></tbody>
        </table>
    </div>
</div>
<div id="paginationControls" class="hidden flex items-center justify-between mt-4"></div>

<script>
const tbody = document.getElementById('runsBody');
const taskFilter = document.getElementById('taskFilter');
const statusFilter = document.getElementById('statusFilter');
const clearBtn = document.getElementById('clearFilters');
statusFilter.value = getParam('status');
const pager = new Paginator({ perPageHost: 'perPageHost', controlsHost: 'paginationControls', onChange: loadRuns });
let runsCache = [], runSort = { key: 'id', dir: 'desc' };
const runAcc = { id: r => r.ID, task: r => (r.Task && r.Task.Name) || '', status: r => r.Status, started: r => r.StartedAt || r.CreatedAt, duration: r => r.StartedAt ? (new Date(r.CompletedAt || Date.now()) - new Date(r.StartedAt)) : -1 };
initSortable(document.querySelector('table'), (key, dir) => { runSort = { key, dir }; renderRuns(); }, runSort);

async function loadTaskOptions() {
    const r = await api('/api/scans/tasks/options');
    if (!r.ok) return;
    r.data.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; taskFilter.appendChild(o); });
    taskFilter.value = getParam('task_id');
    syncClear();
}
function syncClear() { clearBtn.classList.toggle('hidden', !taskFilter.value && !statusFilter.value); }
function filtersChanged() { pager.reset(); setParams({ task_id: taskFilter.value, status: statusFilter.value }); syncClear(); loadRuns(); }
taskFilter.addEventListener('change', filtersChanged);
statusFilter.addEventListener('change', filtersChanged);
clearBtn.addEventListener('click', () => { taskFilter.value = ''; statusFilter.value = ''; filtersChanged(); });

async function loadRuns() {
    tbody.innerHTML = loadingRow(8);
    const r = await api(`/api/scans/runs?${pager.query()}&status=${statusFilter.value}&task_id=${taskFilter.value || getParam('task_id')}`);
    if (!r.ok) { tbody.innerHTML = emptyRow(8, 'fa-triangle-exclamation', errorDetail(r, 'Failed to load runs')); return; }
    const data = r.data; runsCache = data.items || [];
    pager.update(data);
    if (!runsCache.length) { tbody.innerHTML = emptyRow(8, 'fa-inbox', data.total === 0 && !statusFilter.value && !taskFilter.value ? 'No scans have run yet.' : 'No runs match these filters.'); return; }
    renderRuns();
}

function renderRuns() {
    const runs = sortRows(runsCache, runAcc[runSort.key] || runAcc.id, runSort.dir);
    tbody.innerHTML = runs.map(r => {
        const task = r.Task || {};
        const active = r.Status === 'running' || r.Status === 'queued';
        return `<tr>
            <td class="font-mono text-gray-400">#${r.ID}</td>
            <td><a href="/tasks/view/${task.ID || r.TaskID}" class="text-white hover:text-primary-400 font-medium">${escapeHtml(task.Name || '—')}</a></td>
            <td>${statusBadge(r.Status)}${r.Status === 'failed' && r.ErrorMessage ? `<button type="button" class="ml-1 text-gray-500 hover:text-white" title="${escapeHtml(r.ErrorMessage)}" onclick="toast.error(this.title, 10000)" aria-label="Show error"><i class="fas fa-info-circle"></i></button>` : ''}</td>
            <td>${progressBar(r.Progress, r.Status)}</td>
            <td>${timeCell(r.StartedAt || r.CreatedAt)}</td>
            <td class="text-gray-400 tabular-nums">${r.StartedAt ? duration(r.StartedAt, r.CompletedAt) : '-'}</td>
            <td>${r.Report ? `<a href="/reports/${r.Report.ID}" class="text-primary-400 hover:underline">#${r.Report.ID}</a>` : '<span class="text-gray-600">-</span>'}</td>
            <td class="text-right whitespace-nowrap">
                ${active ? `<a href="/tasks/run/${r.ID}" class="btn-secondary btn-xs"><i class="fas fa-tower-broadcast"></i>Live</a>
                            <button type="button" class="btn-danger-ghost btn-xs" onclick="cancelRun(${r.ID})"><i class="fas fa-ban"></i>Cancel</button>` : ''}
            </td>
        </tr>`;
    }).join('');
}

async function cancelRun(id) {
    if (!await confirmDialog({ title: `Cancel run #${id}?`, message: 'The running nmap process will be killed and no report will be produced.', confirmText: 'Cancel scan', danger: true })) return;
    const r = await api(`/api/scans/runs/${id}/cancel`, { method: 'POST' });
    if (r.ok) { toast.success(r.data.detail); setTimeout(loadRuns, 1500); } else toast.error(errorDetail(r, 'Could not cancel'));
}

loadTaskOptions();
loadRuns();
// Keep active runs fresh without a manual refresh.
setInterval(() => { if (document.visibilityState === 'visible' && tbody.querySelector('.fa-spin')) loadRuns(); }, 10000);
</script>
{{template "footer" .}}
