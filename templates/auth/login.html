<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body class="bg-gray-900 text-gray-100 min-h-screen">
{{template "nav" .}}
<main class="max-w-md mx-auto mt-20">
    <div class="bg-gray-800 rounded-lg shadow-lg p-8">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div id="errorMsg" class="text-red-400 text-sm hidden"></div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition">Sign In</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-500">Contact your administrator for account access.</p>
    </div>
</main>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('hidden');
    const res = await fetch('/api/auth/login', { method: 'POST', body: formData, credentials: 'same-origin' });
    if (res.ok) { window.location.href = '/'; }
    else { const data = await res.json(); errorMsg.textContent = data.detail || 'Login failed'; errorMsg.classList.remove('hidden'); }
});
</script>
</body>
</html>
