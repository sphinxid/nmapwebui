<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-950 bg-[radial-gradient(ellipse_at_top,rgba(16,185,129,0.12),transparent_60%)]">
    <main class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-primary-600 rounded-2xl mb-4 shadow-lg shadow-primary-900/40">
                <i class="fas fa-network-wired text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">NmapWebUI</h1>
            <p class="text-sm text-gray-400 mt-1">Sign in to continue</p>
        </div>

        <form id="loginForm" action="/api/auth/login" method="POST" autocomplete="on" class="card p-6 space-y-5" novalidate>
            <div>
                <label for="username" class="label">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" class="input py-2.5" autofocus>
            </div>
            <div>
                <label for="password" class="label">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="input py-2.5 pr-11">
                    <button type="button" id="togglePw" class="absolute right-1 top-1/2 -translate-y-1/2 btn-icon w-8 h-8" aria-label="Show password" aria-pressed="false"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div id="errorMsg" class="form-error hidden" role="alert"></div>
            <button type="submit" id="loginBtn" class="btn-primary w-full py-2.5">
                <span id="loginBtnText">Sign in</span>
                <i id="loginSpinner" class="fas fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-gray-500">No account? Ask your administrator to create one.</p>
    </main>

    <script>
    const pw = document.getElementById('password');
    document.getElementById('togglePw').addEventListener('click', function () {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        this.querySelector('i').className = `fas ${show ? 'fa-eye-slash' : 'fa-eye'}`;
        this.setAttribute('aria-pressed', String(show));
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        errorMsg.classList.add('hidden');
        if (!form.username.value.trim() || !form.password.value) { errorMsg.textContent = 'Enter your username and password.'; errorMsg.classList.remove('hidden'); return; }
        btn.disabled = true; document.getElementById('loginSpinner').classList.remove('hidden');
        const r = await api('/api/auth/login', { method: 'POST', body: new FormData(form) });
        btn.disabled = false; document.getElementById('loginSpinner').classList.add('hidden');
        if (r.ok) {
            const next = new URLSearchParams(window.location.search).get('next');
            window.location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
        } else {
            errorMsg.textContent = errorDetail(r, 'Sign in failed. Check your credentials and try again.');
            errorMsg.classList.remove('hidden');
            form.password.focus(); form.password.select();
        }
    });
    </script>
</body>
</html>
