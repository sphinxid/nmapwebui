<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body class="bg-gray-900 text-gray-100 min-h-screen">
{{template "nav" .}}
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Scan Tasks</h1>
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-1">
            <span class="text-xs text-gray-500 mr-1">Per page:</span>
            <button onclick="setPerPage(20)" data-pp="20" class="pp-btn px-2 py-0.5 rounded text-xs border border-emerald-500 bg-emerald-900 text-emerald-300">20</button>
            <button onclick="setPerPage(50)" data-pp="50" class="pp-btn px-2 py-0.5 rounded text-xs border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600">50</button>
            <button onclick="setPerPage(100)" data-pp="100" class="pp-btn px-2 py-0.5 rounded text-xs border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600">100</button>
            <button onclick="setPerPage(500)" data-pp="500" class="pp-btn px-2 py-0.5 rounded text-xs border border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600">500</button>
        </div>
        <a href="/tasks/create" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm font-medium transition"><i class="fas fa-plus mr-2"></i>New Task</a>
    </div>
</div>
<div id="tasksContainer" class="space-y-4">
    <div class="text-center text-gray-500 py-8">Loading tasks...</div>
</div>

<div id="paginationControls" class="hidden flex items-center justify-between mt-4">
    <span class="text-sm text-gray-400" id="pageInfo"></span>
    <div class="flex items-center gap-2">
        <button onclick="goPage(currentPage-1)" id="prevBtn" class="px-3 py-1.5 rounded text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 disabled:opacity-40 disabled:cursor-not-allowed transition">Prev</button>
        <span class="text-sm text-gray-400" id="pageNums"></span>
        <button onclick="goPage(currentPage+1)" id="nextBtn" class="px-3 py-1.5 rounded text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 disabled:opacity-40 disabled:cursor-not-allowed transition">Next</button>
    </div>
</div>

<script>
let currentPage = 1;
let perPage = 20;
let totalPages = 1;

function setPerPage(n) {
    perPage = n;
    currentPage = 1;
    document.querySelectorAll('.pp-btn').forEach(b => {
        const active = parseInt(b.dataset.pp) === n;
        b.className = 'pp-btn px-2 py-0.5 rounded text-xs border ' + (active ? 'border-emerald-500 bg-emerald-900 text-emerald-300' : 'border-gray-600 bg-gray-700 text-gray-300 hover:bg-gray-600');
    });
    loadTasks();
}
function goPage(p) { if (p >= 1 && p <= totalPages) { currentPage = p; loadTasks(); } }

function updatePagination(data) {
    totalPages = data.pages;
    const controls = document.getElementById('paginationControls');
    if (data.total <= data.per_page && data.page === 1) { controls.classList.add('hidden'); return; }
    controls.classList.remove('hidden');
    const start = (data.page - 1) * data.per_page + 1;
    const end = Math.min(data.page * data.per_page, data.total);
    document.getElementById('pageInfo').textContent = `Showing ${start}-${end} of ${data.total}`;
    document.getElementById('pageNums').textContent = `Page ${data.page} of ${data.pages}`;
    document.getElementById('prevBtn').disabled = data.page <= 1;
    document.getElementById('nextBtn').disabled = data.page >= data.pages;
}

async function loadTasks() {
    const res = await fetch(`/api/scans/tasks?page=${currentPage}&per_page=${perPage}`, { credentials: 'same-origin' });
    if (!res.ok) { document.getElementById('tasksContainer').innerHTML = '<div class="text-red-400 text-center">Failed to load tasks</div>'; return; }
    const data = await res.json();
    const tasks = data.items || [];
    const container = document.getElementById('tasksContainer');
    if (tasks.length === 0 && data.total === 0) {
        container.innerHTML = '<div class="text-gray-500 text-center py-8">No scan tasks yet. <a href="/tasks/create" class="text-emerald-400 hover:underline">Create one</a>.</div>';
        document.getElementById('paginationControls').classList.add('hidden');
        return;
    }
    container.innerHTML = tasks.map(t => {
        const s = t.last_scan_summary;
        let summaryHtml = '';
        if (s) {
            const portRows = (s.top_ports || []).map(p =>
                `<tr class="border-t border-gray-700">
                    <td class="py-1 pr-3 font-mono text-xs text-gray-200">${escapeHtml(p.ip_address)}</td>
                    <td class="py-1 pr-3 font-mono text-xs text-emerald-300">${p.port_number}/${escapeHtml(p.protocol)}</td>
                    <td class="py-1 pr-3 text-xs text-blue-300">${escapeHtml(p.service || '-')}</td>
                    <td class="py-1 text-xs text-gray-400">${escapeHtml(p.version || '-')}</td>
                </tr>`
            ).join('');
            const moreBadge = s.total_open > 10
                ? `<span class="ml-2 text-xs text-gray-500">+${s.total_open - 10} more</span>`
                : '';
            summaryHtml = `
            <div class="mt-3 border border-gray-700 rounded-md bg-gray-900 px-3 pt-2 pb-2">
                <div class="flex items-center gap-4 mb-2">
                    <span class="text-xs text-gray-400">Last scan:</span>
                    <span class="text-xs font-medium text-emerald-400"><i class="fas fa-plug mr-1"></i>${s.total_open} open port${s.total_open !== 1 ? 's' : ''}</span>
                    <span class="text-xs text-gray-400">${s.total_hosts} host${s.total_hosts !== 1 ? 's' : ''}</span>
                    <a href="/reports/${s.report_id}" class="text-xs text-blue-400 hover:underline ml-auto">View Report #${s.report_id}</a>
                </div>
                ${portRows ? `<table class="w-full">
                    <thead><tr>
                        <th class="text-left text-xs text-gray-500 font-semibold pb-1 pr-3">IP</th>
                        <th class="text-left text-xs text-gray-500 font-semibold pb-1 pr-3">Port</th>
                        <th class="text-left text-xs text-gray-500 font-semibold pb-1 pr-3">Service</th>
                        <th class="text-left text-xs text-gray-500 font-semibold pb-1">Version</th>
                    </tr></thead>
                    <tbody>${portRows}</tbody>
                </table>${moreBadge}` : '<span class="text-xs text-gray-500">No open ports found.</span>'}
            </div>`;
        }
        return `
        <div class="bg-gray-800 rounded-lg p-4 shadow hover:shadow-lg transition">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-semibold text-lg">${escapeHtml(t.Name)}</h3>
                    <p class="text-sm text-gray-400">${t.ScanProfile || 'Custom'} &bull; ${(t.TargetGroups || []).length} target groups</p>
                    ${t.IsScheduled ? '<span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded mt-1 inline-block">Scheduled</span>' : ''}
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="runTask(${t.ID})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm transition"><i class="fas fa-play mr-1"></i>Run</button>
                    <a href="/tasks/view/${t.ID}" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm transition">View</a>
                </div>
            </div>
            ${summaryHtml}
        </div>`;
    }).join('');
    updatePagination(data);
}
async function runTask(id) {
    const res = await fetch(`/api/scans/tasks/${id}/run`, { method: 'POST', credentials: 'same-origin' });
    if (res.ok) { const run = await res.json(); window.location.href = `/tasks/run/${run.ID}`; }
    else { const err = await res.json(); alert(err.detail || 'Failed to start scan'); }
}
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
loadTasks();
</script>
</main>
</body>
</html>
