<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Scan Tasks</h1>
        <p class="page-subtitle">A task combines a scan profile with one or more target groups. Run it on demand or on a schedule.</p>
    </div>
    <a href="/tasks/create" class="btn-primary"><i class="fas fa-plus"></i>New Task</a>
</div>

<div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
    <div class="relative flex-1 max-w-md">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
        <input type="search" id="searchInput" class="input pl-9" placeholder="Search tasks by name…" aria-label="Search tasks">
    </div>
    <select id="scheduledFilter" class="select w-auto" aria-label="Filter by schedule">
        <option value="">All tasks</option>
        <option value="1">Scheduled only</option>
        <option value="0">Unscheduled only</option>
    </select>
    <div id="perPageHost" class="sm:ml-auto flex items-center"></div>
</div>

<div id="tasksContainer" class="space-y-3"></div>
<div id="paginationControls" class="hidden flex items-center justify-between mt-4"></div>

<script>
const container = document.getElementById('tasksContainer');
const searchInput = document.getElementById('searchInput');
const scheduledFilter = document.getElementById('scheduledFilter');
searchInput.value = getParam('q');
scheduledFilter.value = getParam('scheduled');

const pager = new Paginator({ perPageHost: 'perPageHost', controlsHost: 'paginationControls', onChange: loadTasks });

let searchTimer;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { pager.reset(); setParams({ q: searchInput.value.trim() }); loadTasks(); }, 300); });
scheduledFilter.addEventListener('change', () => { pager.reset(); setParams({ scheduled: scheduledFilter.value }); loadTasks(); });

function lastRunLine(t) {
    if (t.active_run) {
        return `<span class="text-amber-300"><i class="fas fa-spinner fa-spin mr-1"></i>${t.active_run.status === 'running' ? `Running · ${t.active_run.progress || 0}%` : 'Queued'}</span>
                <a href="/tasks/run/${t.active_run.id}" class="text-primary-400 hover:underline ml-2">Watch live</a>`;
    }
    if (!t.last_run) return '<span class="text-gray-500">Never run</span>';
    const r = t.last_run;
    const when = r.completed_at || r.started_at || r.created_at;
    const icon = r.status === 'completed' ? 'fa-check text-emerald-400' : r.status === 'failed' ? 'fa-times text-red-400' : 'fa-ban text-gray-400';
    return `<i class="fas ${icon} mr-1"></i>${STATUS_META[r.status] ? STATUS_META[r.status].label : r.status} ${timeCell(when)}${r.status === 'failed' && r.error_message ? `<span class="text-gray-500 ml-1" title="${escapeHtml(r.error_message)}"><i class="fas fa-info-circle"></i></span>` : ''}`;
}

function nextRunLine(t) {
    if (!t.IsScheduled) return '';
    if (!t.next_run) return '<span class="badge-blue"><i class="fas fa-clock"></i>Scheduled</span>';
    return `<span class="badge-blue" title="${escapeHtml(formatDateTime(t.next_run))}"><i class="fas fa-clock"></i>Next ${relativeTime(t.next_run)}</span>`;
}

function summaryBlock(s) {
    if (!s) return '';
    const rows = (s.top_ports || []).map(p => `
        <tr>
            <td class="py-1 pr-3 font-mono text-xs text-gray-200">${escapeHtml(p.ip_address)}</td>
            <td class="py-1 pr-3 font-mono text-xs text-primary-300">${p.port_number}/${escapeHtml(p.protocol)}</td>
            <td class="py-1 pr-3 text-xs text-blue-300">${escapeHtml(p.service || '-')}</td>
            <td class="py-1 text-xs text-gray-400 truncate max-w-[16rem]">${escapeHtml(p.version || '-')}</td>
        </tr>`).join('');
    const more = s.total_open > 10 ? `<span class="text-xs text-gray-500">+${s.total_open - 10} more</span>` : '';
    return `
        <details class="mt-3 group">
            <summary class="flex items-center gap-3 text-xs cursor-pointer select-none text-gray-400 hover:text-gray-200">
                <i class="fas fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i>
                <span class="text-primary-300 font-medium"><i class="fas fa-plug mr-1"></i>${pluralize(s.total_open, 'open port')}</span>
                <span>${pluralize(s.total_hosts, 'host')}</span>
                <a href="/reports/${s.report_id}" class="ml-auto text-blue-400 hover:underline" onclick="event.stopPropagation()">Latest report <i class="fas fa-arrow-right text-[10px]"></i></a>
            </summary>
            <div class="mt-2 rounded-md border border-gray-800 bg-gray-950/60 px-3 py-2 overflow-x-auto">
                ${rows ? `<table class="w-full"><thead><tr class="text-left text-[11px] uppercase tracking-wider text-gray-500"><th class="pb-1 pr-3 font-medium">Host</th><th class="pb-1 pr-3 font-medium">Port</th><th class="pb-1 pr-3 font-medium">Service</th><th class="pb-1 font-medium">Version</th></tr></thead><tbody class="divide-y divide-gray-800">${rows}</tbody></table>${more}` : '<span class="text-xs text-gray-500">No open ports found in the last scan.</span>'}
            </div>
        </details>`;
}

async function loadTasks() {
    container.innerHTML = `<div class="empty"><i class="fas fa-circle-notch fa-spin"></i>Loading tasks…</div>`;
    const q = encodeURIComponent(searchInput.value.trim());
    const r = await api(`/api/scans/tasks?${pager.query()}&q=${q}&scheduled=${scheduledFilter.value}`);
    if (!r.ok) { container.innerHTML = `<div class="empty text-red-400"><i class="fas fa-triangle-exclamation"></i>${escapeHtml(errorDetail(r, 'Failed to load tasks'))}</div>`; return; }
    const data = r.data, tasks = data.items || [];
    pager.update(data);
    if (!tasks.length) {
        container.innerHTML = data.total === 0 && !q && !scheduledFilter.value
            ? `<div class="card empty"><i class="fas fa-crosshairs"></i><p class="text-gray-300 font-medium">No scan tasks yet</p><p class="text-sm mt-1">Create a task to start scanning your targets.</p><a href="/tasks/create" class="btn-primary mt-4"><i class="fas fa-plus"></i>New Task</a></div>`
            : `<div class="card empty"><i class="fas fa-search"></i><p>No tasks match your filter.</p></div>`;
        return;
    }
    container.innerHTML = tasks.map(t => `
        <div class="card p-4 sm:p-5">
            <div class="flex flex-col sm:flex-row sm:items-start gap-3">
                <div class="min-w-0 flex-1">
                    <div class="flex flex-wrap items-center gap-2">
                        <a href="/tasks/view/${t.ID}" class="text-lg font-semibold text-white hover:text-primary-400">${escapeHtml(t.Name)}</a>
                        ${nextRunLine(t)}
                    </div>
                    <div class="text-sm text-gray-400 mt-1 flex flex-wrap gap-x-3 gap-y-1">
                        <span><i class="fas fa-sliders mr-1 text-gray-500"></i>${escapeHtml(t.ScanProfile || (t.CustomArgs ? 'Custom: ' + t.CustomArgs : 'Default'))}</span>
                        <span><i class="fas fa-bullseye mr-1 text-gray-500"></i>${pluralize((t.TargetGroups || []).length, 'group')} · ${pluralize(t.target_count || 0, 'target')}</span>
                    </div>
                    <div class="text-sm mt-2 text-gray-300">${lastRunLine(t)}</div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    ${t.active_run
                        ? `<button type="button" class="btn-danger-ghost btn-sm" onclick="cancelRun(${t.active_run.id})"><i class="fas fa-ban"></i>Cancel</button>`
                        : `<button type="button" class="btn-primary btn-sm" onclick="runTask(${t.ID})"><i class="fas fa-play"></i>Run</button>`}
                    <a href="/tasks/view/${t.ID}" class="btn-secondary btn-sm">Details</a>
                </div>
            </div>
            ${summaryBlock(t.last_scan_summary)}
        </div>`).join('');
}

async function runTask(id) {
    const r = await api(`/api/scans/tasks/${id}/run`, { method: 'POST' });
    if (r.ok) window.location.href = `/tasks/run/${r.data.ID}`;
    else toast.error(errorDetail(r, 'Failed to start scan'));
}
async function cancelRun(id) {
    if (!await confirmDialog({ title: 'Cancel this scan?', message: 'The running nmap process will be killed.', confirmText: 'Cancel scan', danger: true })) return;
    const r = await api(`/api/scans/runs/${id}/cancel`, { method: 'POST' });
    if (r.ok) { toast.success(r.data.detail); setTimeout(loadTasks, 1500); } else toast.error(errorDetail(r, 'Could not cancel'));
}

loadTasks();
</script>
{{template "footer" .}}
