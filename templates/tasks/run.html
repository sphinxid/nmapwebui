<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="max-w-3xl mx-auto">
    <nav class="text-sm text-gray-500 mb-4" aria-label="Breadcrumb"><a href="/tasks" class="hover:text-white">Scan Tasks</a> <span class="mx-1">/</span> <a id="crumbTask" href="#" class="hover:text-white">…</a> <span class="mx-1">/</span> <span class="text-gray-300">Run #<span id="runId"></span></span></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Scan Run #<span id="runIdTitle"></span></h1>
            <p class="page-subtitle" id="runMeta">Connecting…</p>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" id="cancelBtn" class="btn-danger-ghost hidden" onclick="cancelRun()"><i class="fas fa-ban"></i>Cancel scan</button>
            <a id="reportLink" href="#" class="btn-primary hidden"><i class="fas fa-file-lines"></i>View report</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="flex items-center justify-between mb-3">
                <div id="statusLabel"></div>
                <div class="text-right">
                    <div id="progressLabel" class="text-2xl font-bold text-white tabular-nums">0%</div>
                    <div id="elapsed" class="text-xs text-gray-500 tabular-nums"></div>
                </div>
            </div>
            <div class="progress h-3" role="progressbar" id="progressWrap" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar" class="progress-fill" style="width:0%"></div></div>
            <div id="errorBox" class="form-error mt-4 hidden"></div>
            <div class="mt-4">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs uppercase tracking-wider text-gray-500">Event log</span>
                    <button type="button" class="btn-ghost btn-xs" onclick="document.getElementById('eventLog').innerHTML=''"><i class="fas fa-eraser"></i>Clear</button>
                </div>
                <div id="eventLog" class="rounded-md bg-gray-950 border border-gray-800 p-3 h-72 overflow-y-auto font-mono text-xs text-gray-300 space-y-0.5" aria-live="polite"></div>
            </div>
        </div>
    </div>
    <p class="text-xs text-gray-500"><i class="fas fa-circle-info mr-1"></i>Progress comes from nmap's own estimate and may jump. The log shows only events received while this page is open.</p>
</div>

<script>
const runId = window.location.pathname.split('/').pop();
document.getElementById('runId').textContent = runId;
document.getElementById('runIdTitle').textContent = runId;
const statusLabel = document.getElementById('statusLabel');
const progressLabel = document.getElementById('progressLabel');
const progressBarEl = document.getElementById('progressBar');
const eventLog = document.getElementById('eventLog');
let run = null, startedAt = null, finished = false, evtSource = null;

function addLog(msg, type = 'info') {
    const div = document.createElement('div');
    const cls = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : type === 'muted' ? 'text-gray-500' : '';
    div.innerHTML = `<span class="text-gray-600">[${new Date().toLocaleTimeString()}]</span> <span class="${cls}">${escapeHtml(msg)}</span>`;
    eventLog.appendChild(div);
    eventLog.scrollTop = eventLog.scrollHeight;
}

function setStatus(status, progress) {
    statusLabel.innerHTML = statusBadge(status);
    if (progress !== undefined && progress !== null) {
        const pct = status === 'completed' ? 100 : Math.max(0, Math.min(100, progress));
        progressLabel.textContent = pct + '%';
        progressBarEl.style.width = pct + '%';
        document.getElementById('progressWrap').setAttribute('aria-valuenow', pct);
    }
    progressBarEl.classList.toggle('is-failed', status === 'failed');
    progressBarEl.classList.toggle('is-cancelled', status === 'cancelled');
    const active = status === 'running' || status === 'queued';
    document.getElementById('cancelBtn').classList.toggle('hidden', !active);
    if (!active && !finished) {
        finished = true;
        if (evtSource) evtSource.close();
        document.title = `${STATUS_META[status] ? STATUS_META[status].label : status} · Run #${runId} · NmapWebUI`;
        loadRun(); // fetch final details (report link, error)
    }
}

async function loadRun() {
    const r = await api(`/api/scans/runs/${runId}`);
    if (!r.ok) { document.getElementById('runMeta').textContent = 'Run not found.'; addLog('Run not found', 'error'); return; }
    run = r.data;
    startedAt = run.StartedAt || run.CreatedAt;
    const task = run.Task || {};
    const crumb = document.getElementById('crumbTask'); crumb.textContent = task.Name || 'Task'; crumb.href = `/tasks/view/${task.ID || run.TaskID}`;
    document.getElementById('runMeta').innerHTML = `<a href="/tasks/view/${task.ID || run.TaskID}" class="text-primary-400 hover:underline">${escapeHtml(task.Name || 'Task')}</a> · started ${run.StartedAt ? formatDateTime(run.StartedAt) : 'not yet'}`;
    setStatus(run.Status, run.Progress);
    const errBox = document.getElementById('errorBox');
    if ((run.Status === 'failed' || run.Status === 'cancelled') && run.ErrorMessage) { errBox.textContent = run.ErrorMessage; errBox.classList.remove('hidden'); }
    if (run.Report && run.Report.ID) { const l = document.getElementById('reportLink'); l.href = `/reports/${run.Report.ID}`; l.classList.remove('hidden'); }
    else if (run.Status === 'completed') setTimeout(loadRun, 2000); // report is written just after completion
}

function tickElapsed() {
    if (!startedAt) return;
    const end = run && run.CompletedAt ? run.CompletedAt : null;
    document.getElementById('elapsed').textContent = (end ? 'took ' : 'elapsed ') + duration(startedAt, end);
}
setInterval(tickElapsed, 1000);

function connect() {
    evtSource = new EventSource(`/api/sse/scans/${runId}/events`);
    evtSource.addEventListener('state', e => { const d = JSON.parse(e.data); addLog(`Connected. Current state: ${d.status} (${d.progress || 0}%)`, 'muted'); setStatus(d.status, d.progress); });
    evtSource.addEventListener('status', e => {
        const d = JSON.parse(e.data);
        addLog(d.message || d.status, d.status === 'failed' ? 'error' : d.status === 'completed' ? 'success' : d.status === 'cancelled' ? 'muted' : 'info');
        if (d.status === 'running' || d.status === 'completed' || d.status === 'failed' || d.status === 'cancelled') setStatus(d.status, d.status === 'completed' ? 100 : undefined);
    });
    evtSource.addEventListener('progress', e => { const d = JSON.parse(e.data); setStatus('running', d.progress || 0); addLog(`Progress ${d.progress || 0}%`, 'muted'); });
    evtSource.addEventListener('error', () => { if (!finished) addLog('Event stream interrupted, reconnecting…', 'error'); });
}

async function cancelRun() {
    if (!await confirmDialog({ title: `Cancel run #${runId}?`, message: 'The running nmap process will be killed and no report will be produced.', confirmText: 'Cancel scan', danger: true })) return;
    const r = await api(`/api/scans/runs/${runId}/cancel`, { method: 'POST' });
    if (r.ok) { toast.success(r.data.detail); addLog('Cancellation requested', 'muted'); if (r.data.status === 'cancelled') setStatus('cancelled'); }
    else toast.error(errorDetail(r, 'Could not cancel'));
}

loadRun().then(() => { if (!finished) connect(); });
</script>
{{template "footer" .}}
