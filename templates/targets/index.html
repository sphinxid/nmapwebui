<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Target Groups</h1>
        <p class="page-subtitle">Group IPs, CIDR ranges and hostnames so tasks can reference them together.</p>
    </div>
    <button type="button" class="btn-primary" onclick="openGroupModal()"><i class="fas fa-plus"></i>New Group</button>
</div>

<div class="flex items-center justify-end mb-4"><div id="perPageHost" class="flex items-center"></div></div>
<div id="groupsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
<div id="paginationControls" class="hidden flex items-center justify-between mt-4"></div>

<!-- Create / edit modal -->
<div id="groupModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
    <form id="groupForm" class="modal-panel" novalidate>
        <div class="modal-header">
            <h2 id="groupModalTitle" class="card-title">Create Target Group</h2>
            <button type="button" class="btn-icon" data-modal-close aria-label="Close"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" name="id">
            <div>
                <label class="label" for="groupName">Name</label>
                <input type="text" id="groupName" name="name" required maxlength="64" class="input" placeholder="e.g. Office LAN">
            </div>
            <div>
                <label class="label" for="groupDesc">Description <span class="text-gray-500 font-normal">(optional)</span></label>
                <input type="text" id="groupDesc" name="description" maxlength="255" class="input">
            </div>
            <div>
                <label class="label" for="groupTargets">Targets <span class="text-gray-500 font-normal">— one per line</span></label>
                <textarea id="groupTargets" name="targets" rows="6" class="input font-mono text-sm" placeholder="192.168.1.10&#10;10.0.0.0/24&#10;scanme.nmap.org"></textarea>
                <p class="text-xs text-gray-500 mt-1.5">Accepts single IPs, CIDR ranges and hostnames. <span id="targetCount"></span></p>
            </div>
            <div id="modalError" class="form-error hidden"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" data-modal-close>Cancel</button>
            <button type="submit" id="groupSubmit" class="btn-primary">Create</button>
        </div>
    </form>
</div>

<script>
const container = document.getElementById('groupsContainer');
const pager = new Paginator({ perPageHost: 'perPageHost', controlsHost: 'paginationControls', onChange: loadGroups });
let groupsCache = [];

function classify(line) {
    if (line.includes('/')) return 'cidr';
    if (/^[0-9a-fA-F:.]+$/.test(line) && (line.includes(':') || /^\d{1,3}(\.\d{1,3}){3}(-\d{1,3})?$/.test(line))) return 'ip';
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(line)) return 'ip';
    return 'hostname';
}
const typeBadge = { ip: 'text-primary-300', cidr: 'text-blue-300', hostname: 'text-amber-300' };

async function loadGroups() {
    container.innerHTML = `<div class="empty col-span-full"><i class="fas fa-circle-notch fa-spin"></i>Loading groups…</div>`;
    const r = await api(`/api/targets?${pager.query()}`);
    if (!r.ok) { container.innerHTML = `<div class="empty col-span-full text-red-400"><i class="fas fa-triangle-exclamation"></i>${escapeHtml(errorDetail(r, 'Failed to load'))}</div>`; return; }
    const data = r.data; groupsCache = data.items || [];
    pager.update(data);
    if (!groupsCache.length) {
        container.innerHTML = `<div class="card empty col-span-full"><i class="fas fa-bullseye"></i><p class="text-gray-300 font-medium">No target groups yet</p><p class="text-sm mt-1">Create a group, then reference it from a scan task.</p><button type="button" class="btn-primary mt-4" onclick="openGroupModal()"><i class="fas fa-plus"></i>New Group</button></div>`;
        return;
    }
    container.innerHTML = groupsCache.map(g => {
        const targets = g.Targets || [];
        return `
        <div class="card flex flex-col">
            <div class="card-header">
                <div class="min-w-0">
                    <h3 class="card-title truncate">${escapeHtml(g.Name)}</h3>
                    ${g.Description ? `<p class="text-xs text-gray-400 mt-0.5 truncate">${escapeHtml(g.Description)}</p>` : ''}
                </div>
                <div class="flex items-center gap-1 flex-shrink-0">
                    <button type="button" class="btn-icon" onclick="openGroupModal(${g.ID})" title="Edit group" aria-label="Edit ${escapeHtml(g.Name)}"><i class="fas fa-pen"></i></button>
                    <button type="button" class="btn-icon hover:text-red-400" onclick="deleteGroup(${g.ID})" title="Delete group" aria-label="Delete ${escapeHtml(g.Name)}"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="p-3 flex-1">
                <div class="rounded-md bg-gray-950/60 border border-gray-800 p-2 max-h-44 overflow-y-auto font-mono text-xs space-y-0.5">
                    ${targets.length ? targets.map(t => `<div class="flex gap-2"><span class="w-16 ${typeBadge[t.TargetType] || 'text-gray-400'}">${escapeHtml(t.TargetType)}</span><span class="text-gray-200">${escapeHtml(t.Value)}</span></div>`).join('') : '<div class="text-gray-500">No targets</div>'}
                </div>
            </div>
            <div class="px-4 py-3 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
                <span>${pluralize(targets.length, 'target')}</span>
                <a href="/tasks/create?group=${g.ID}" class="text-primary-400 hover:underline">Create task <i class="fas fa-arrow-right text-[10px]"></i></a>
            </div>
        </div>`;
    }).join('');
}

const form = document.getElementById('groupForm');
const targetsArea = document.getElementById('groupTargets');
targetsArea.addEventListener('input', updateTargetCount);
function updateTargetCount() {
    const n = targetsArea.value.split('\n').map(l => l.trim()).filter(Boolean).length;
    document.getElementById('targetCount').textContent = n ? `${pluralize(n, 'target')} entered.` : '';
}

function openGroupModal(id) {
    form.reset();
    document.getElementById('modalError').classList.add('hidden');
    const g = id ? groupsCache.find(x => x.ID === id) : null;
    form.id.value = g ? g.ID : '';
    document.getElementById('groupModalTitle').textContent = g ? 'Edit Target Group' : 'Create Target Group';
    document.getElementById('groupSubmit').textContent = g ? 'Save changes' : 'Create';
    if (g) {
        form.name.value = g.Name; form.description.value = g.Description || '';
        targetsArea.value = (g.Targets || []).map(t => t.Value).join('\n');
    }
    updateTargetCount();
    openModal('groupModal');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('modalError'); err.classList.add('hidden');
    const name = form.name.value.trim();
    if (!name) { err.textContent = 'Name is required.'; err.classList.remove('hidden'); form.name.focus(); return; }
    const lines = [...new Set(targetsArea.value.split('\n').map(l => l.trim()).filter(Boolean))];
    if (!lines.length) { err.textContent = 'Add at least one target.'; err.classList.remove('hidden'); targetsArea.focus(); return; }
    const body = { name, description: form.description.value.trim(), targets: lines.map(l => ({ value: l, target_type: classify(l) })) };
    const id = form.id.value;
    const btn = document.getElementById('groupSubmit'); btn.disabled = true;
    const r = id ? await api(`/api/targets/${id}`, { method: 'PUT', body }) : await api('/api/targets', { method: 'POST', body });
    btn.disabled = false;
    if (r.ok) { closeModal('groupModal'); toast.success(id ? 'Group updated' : 'Group created'); loadGroups(); }
    else { err.textContent = errorDetail(r, 'Failed to save group'); err.classList.remove('hidden'); }
});

async function deleteGroup(id) {
    const g = groupsCache.find(x => x.ID === id);
    const name = g ? g.Name : `group #${id}`;
    if (!await confirmDialog({ title: `Delete "${name}"?`, message: 'All targets in this group are removed. Tasks referencing it will lose these targets.', confirmText: 'Delete', danger: true })) return;
    const r = await api(`/api/targets/${id}`, { method: 'DELETE' });
    if (r.ok) { toast.success('Group deleted'); loadGroups(); } else toast.error(errorDetail(r, 'Failed to delete'));
}

loadGroups();
</script>
{{template "footer" .}}
