<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
{{template "nav" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Users</h1>
        <p class="page-subtitle">Accounts that can sign in. Admins manage users; the superadmin manages admins.</p>
    </div>
    <button type="button" class="btn-primary" onclick="showCreateModal()"><i class="fas fa-user-plus"></i>Add User</button>
</div>

<div class="flex items-center justify-end mb-4"><div id="perPageHost" class="flex items-center"></div></div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th class="text-right">Actions</th></tr></thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>
</div>
<div id="paginationControls" class="hidden flex items-center justify-between mt-4"></div>

<!-- Create modal -->
<div id="createModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="createTitle">
    <form id="createForm" class="modal-panel max-w-md" novalidate>
        <div class="modal-header"><h2 id="createTitle" class="card-title">Add User</h2><button type="button" class="btn-icon" data-modal-close aria-label="Close"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
            <div><label class="label" for="cUsername">Username</label><input type="text" id="cUsername" name="username" required maxlength="64" autocomplete="off" class="input"></div>
            <div><label class="label" for="cEmail">Email</label><input type="email" id="cEmail" name="email" required class="input"></div>
            <div><label class="label" for="cPassword">Password</label><input type="password" id="cPassword" name="password" required minlength="6" autocomplete="new-password" class="input"><p class="text-xs text-gray-500 mt-1">At least 6 characters.</p></div>
            <div><label class="label" for="createRoleSelect">Role</label><select name="role" id="createRoleSelect" class="select"><option value="user">User</option></select></div>
            <div id="createError" class="form-error hidden"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-secondary" data-modal-close>Cancel</button><button type="submit" class="btn-primary">Create user</button></div>
    </form>
</div>

<!-- Edit modal -->
<div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form id="editForm" class="modal-panel max-w-md" novalidate>
        <div class="modal-header"><h2 id="editTitle" class="card-title">Edit <span id="editUsername" class="text-primary-400"></span></h2><button type="button" class="btn-icon" data-modal-close aria-label="Close"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div><label class="label" for="editEmail">Email</label><input type="email" id="editEmail" name="email" class="input"></div>
            <div><label class="label" for="editPassword">New password <span class="text-gray-500 font-normal">(leave blank to keep)</span></label><input type="password" id="editPassword" name="password" minlength="6" autocomplete="new-password" class="input"></div>
            <div id="editRoleGroup"><label class="label" for="editRoleSelect">Role</label><select name="role" id="editRoleSelect" class="select"><option value="user">User</option></select></div>
            <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-300"><input type="checkbox" name="active" id="editActive" class="checkbox">Account is active</label>
            <div id="editError" class="form-error hidden"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-secondary" data-modal-close>Cancel</button><button type="submit" class="btn-primary">Save changes</button></div>
    </form>
</div>

<script>
const myRole = '{{if .User}}{{.User.Role}}{{end}}';
const myId = {{if .User}}{{.User.ID}}{{else}}0{{end}};
const isSuperAdmin = myRole === 'superadmin';
const tbody = document.getElementById('usersBody');
const pager = new Paginator({ perPageHost: 'perPageHost', controlsHost: 'paginationControls', onChange: loadUsers });
let usersCache = [];

if (isSuperAdmin) {
    document.getElementById('createRoleSelect').innerHTML = '<option value="user">User</option><option value="admin">Admin</option>';
    document.getElementById('editRoleSelect').innerHTML = '<option value="user">User</option><option value="admin">Admin</option>';
}
const roleBadge = r => r === 'superadmin' ? 'badge-purple' : r === 'admin' ? 'badge-amber' : 'badge-gray';

async function loadUsers() {
    tbody.innerHTML = loadingRow(6);
    const r = await api(`/api/admin/users?${pager.query()}`);
    if (!r.ok) { tbody.innerHTML = emptyRow(6, 'fa-triangle-exclamation', errorDetail(r, 'Failed to load users')); return; }
    const data = r.data; usersCache = data.items || [];
    pager.update(data);
    if (!usersCache.length) { tbody.innerHTML = emptyRow(6, 'fa-users', 'No users'); return; }
    tbody.innerHTML = usersCache.map(u => {
        const canEdit = u.Role !== 'superadmin' || u.ID === myId;
        const canDelete = u.Role !== 'superadmin' && u.ID !== myId && (isSuperAdmin || u.Role === 'user');
        return `<tr>
            <td><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-sm font-bold text-gray-200">${escapeHtml(u.Username.charAt(0).toUpperCase())}</div><span class="font-medium text-white">${escapeHtml(u.Username)}</span>${u.ID === myId ? '<span class="text-xs text-gray-500">(you)</span>' : ''}</div></td>
            <td class="text-gray-400">${escapeHtml(u.Email)}</td>
            <td><span class="${roleBadge(u.Role)}">${escapeHtml(u.Role)}</span></td>
            <td><span class="${u.Active ? 'badge-green' : 'badge-red'}">${u.Active ? 'Active' : 'Disabled'}</span></td>
            <td>${timeCell(u.LastLogin)}</td>
            <td class="text-right whitespace-nowrap">
                ${canEdit ? `<button type="button" class="btn-secondary btn-xs" onclick="editUser(${u.ID})"><i class="fas fa-pen"></i>Edit</button>` : ''}
                ${canDelete ? `<button type="button" class="btn-danger-ghost btn-xs" onclick="deleteUser(${u.ID})"><i class="fas fa-trash"></i>Delete</button>` : ''}
            </td>
        </tr>`;
    }).join('');
}

function showCreateModal() { const f = document.getElementById('createForm'); f.reset(); document.getElementById('createError').classList.add('hidden'); openModal('createModal'); }
document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, err = document.getElementById('createError'); err.classList.add('hidden');
    if (!f.username.value.trim() || !f.email.value.trim() || f.password.value.length < 6) { err.textContent = 'Username, email and a password of at least 6 characters are required.'; err.classList.remove('hidden'); return; }
    const r = await api('/api/admin/users', { method: 'POST', body: { username: f.username.value.trim(), email: f.email.value.trim(), password: f.password.value, role: f.role.value } });
    if (r.ok) { closeModal('createModal'); toast.success('User created'); loadUsers(); }
    else { err.textContent = errorDetail(r, 'Failed to create user'); err.classList.remove('hidden'); }
});

function editUser(id) {
    const u = usersCache.find(x => x.ID === id); if (!u) return;
    document.getElementById('editUserId').value = u.ID;
    document.getElementById('editUsername').textContent = u.Username;
    document.getElementById('editEmail').value = u.Email;
    document.getElementById('editPassword').value = '';
    document.getElementById('editActive').checked = u.Active;
    document.getElementById('editError').classList.add('hidden');
    const roleGroup = document.getElementById('editRoleGroup');
    roleGroup.classList.toggle('hidden', u.Role === 'superadmin');
    if (u.Role !== 'superadmin') document.getElementById('editRoleSelect').value = u.Role;
    openModal('editModal');
}
document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, err = document.getElementById('editError'); err.classList.add('hidden');
    const body = { active: f.active.checked };
    if (f.email.value.trim()) body.email = f.email.value.trim();
    if (f.password.value) { if (f.password.value.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.classList.remove('hidden'); return; } body.password = f.password.value; }
    if (!document.getElementById('editRoleGroup').classList.contains('hidden')) body.role = f.role.value;
    const r = await api(`/api/admin/users/${document.getElementById('editUserId').value}`, { method: 'PUT', body });
    if (r.ok) { closeModal('editModal'); toast.success('User updated'); loadUsers(); }
    else { err.textContent = errorDetail(r, 'Failed to update user'); err.classList.remove('hidden'); }
});

async function deleteUser(id) {
    const u = usersCache.find(x => x.ID === id); if (!u) return;
    if (!await confirmDialog({ title: `Delete user "${u.Username}"?`, message: 'Their target groups, tasks and reports are removed. This cannot be undone.', confirmText: 'Delete user', danger: true })) return;
    const r = await api(`/api/admin/users/${id}`, { method: 'DELETE' });
    if (r.ok) { toast.success('User deleted'); loadUsers(); } else toast.error(errorDetail(r, 'Failed to delete user'));
}

loadUsers();
</script>
{{template "footer" .}}
